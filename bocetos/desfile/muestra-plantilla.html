<meta charset="utf-8">
<title>Desfile del Drop 01</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: una columna del ancho de un teléfono, como el perfil en la app; el post abierto ocupa toda la pantalla. */
:root {
  --bg: #0b0d11;        /* la noche del perfil */
  --surface: #171a21;   /* botones y fondos de iconos */
  --fg: #f2f3f5;
  --muted: #8f95a0;
  --line: #262a33;
  --accent: #6d8bfb;    /* el azul de la marca: la música y los enlaces */
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.perfil { max-width: 470px; margin: 0 auto; display: grid; gap: 14px; }
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; padding-block: 10px; }
.barra b { font-size: 20px; letter-spacing: -0.01em; }
.barra .nota { color: var(--muted); font-size: 12px; }
.cabeza { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.avatar { width: 86px; height: 86px; border-radius: 50%; background: #0d0c0b; display: grid; place-items: center;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--line); }
.avatar svg { width: 52%; height: 52%; }
.cuentas { display: flex; gap: 22px; }
.cuentas div { display: grid; }
.cuentas b { font-size: 17px; font-variant-numeric: tabular-nums; }
.cuentas span { color: var(--muted); font-size: 13px; }
.bio { display: grid; gap: 2px; }
.bio b { font-size: 15px; }
.bio a { color: var(--accent); text-decoration: none; }
.botones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.botones span { background: var(--surface); border-radius: 9px; padding: 8px; text-align: center; font-weight: 600; font-size: 14px; }
.botones span:first-child { background: var(--accent); color: #0b0d11; }
.pestanas { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.pestanas span { display: grid; place-items: center; padding-block: 10px; color: var(--muted); }
.pestanas span:first-child { color: var(--fg); box-shadow: inset 0 -1px 0 var(--fg); }
.pestanas svg { width: 22px; height: 22px; }
.cuadricula { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.cuadricula button { all: unset; cursor: pointer; display: block; aspect-ratio: 3 / 4; max-width: 100%; overflow: hidden; background: var(--surface); }
.cuadricula button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cuadricula img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ayuda { color: var(--muted); font-size: 13px; text-align: center; text-wrap: balance; }

/* El post abierto */
.post { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 6px) calc(env(safe-area-inset-bottom, 0px) + 28px); }
.post .columna { max-width: 470px; margin: 0 auto; display: grid; gap: 10px; }
.arriba { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; text-align: center; }
.arriba b { font-size: 16px; }
.arriba span { color: var(--muted); font-size: 12px; display: block; }
.icono { all: unset; cursor: pointer; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--fg); }
.icono:focus-visible { outline: 2px solid var(--accent); }
.icono svg { width: 24px; height: 24px; }
.autor { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.autor .avatar { width: 34px; height: 34px; box-shadow: 0 0 0 1px var(--line); }
.autor b { font-size: 14px; }
.musica { all: unset; cursor: pointer; display: flex; gap: 6px; align-items: center; color: var(--fg); font-size: 13px; min-width: 0; }
.musica:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.musica svg { width: 13px; height: 13px; flex: none; color: var(--accent); }
.musica span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foto { position: relative; aspect-ratio: 4 / 5; max-width: 100%; background: var(--surface); overflow: hidden; touch-action: pan-y; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .25s ease; }
.foto .flecha { position: absolute; top: 50%; translate: 0 -50%; background: rgba(11, 13, 17, .55); }
.foto .izq { left: 8px; } .foto .der { right: 8px; }
.foto .sonido { position: absolute; right: 10px; bottom: 10px; width: 32px; height: 32px; background: rgba(11, 13, 17, .7); }
.foto .sonido svg { width: 16px; height: 16px; }
.acciones { display: flex; gap: 14px; align-items: center; color: var(--fg); }
.acciones svg { width: 25px; height: 25px; }
.acciones .guardar { margin-left: auto; }
.pie { display: grid; gap: 4px; min-width: 0; }
.pie p { margin: 0; }
.pie .tags { color: var(--accent); }
.pie .etiquetas, .pie .fecha { color: var(--muted); font-size: 13px; }
.solo { all: unset; cursor: pointer; color: var(--muted); font-size: 13px; justify-self: start; padding-block: 4px; }
.solo[aria-pressed="true"] { color: var(--accent); }
.solo:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { .foto img { transition: none; } }
</style>

<main class="perfil" aria-label="Perfil de HIGHT con los 20 posts del desfile">
  <div class="barra"><b>hight</b><span class="nota">Muestra del perfil · 20 posts del desfile</span></div>

    <div class="cuentas"><div><b>20</b><span>publicaciones</span></div></div>
  </div>
  <div class="bio"><b>HIGHT</b><span><!--BIO--></span><a href="https://hight18.myshopify.com" target="_blank" rel="noopener">hight18.myshopify.com</a></div>
  <div class="botones" aria-hidden="true"><span>Seguir</span><span>Mensaje</span></div>
  <div class="pestanas" aria-hidden="true">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg></span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19c1.2-2.6 3.1-4 5.5-4s4.3 1.4 5.5 4"/></svg></span>

<section class="post" id="post" role="dialog" aria-modal="true" aria-labelledby="post-titulo" hidden>
  <div class="columna">
    <div class="arriba">
      <button class="icono" id="cerrar" aria-label="Volver a la cuadrícula"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div><b id="post-titulo">Publicaciones</b><span id="post-numero"></span></div>
      <span></span>
    </div>
    <div class="autor">
      <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="ESTRELLA_PATH" fill="#6d8bfb"/></svg></div>
      <div style="min-width:0"><b>hight</b><br>
        <button class="musica" id="musica" aria-label="Activar o silenciar la música">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
          <span id="musica-nombre"></span>
        </button>
      </div>
      <span></span>
    </div>
    <div class="foto" id="foto">
      <img id="foto-img" alt="">
      <button class="icono flecha izq" id="anterior" aria-label="Post más nuevo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icono flecha der" id="siguiente" aria-label="Post más viejo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="icono sonido" id="sonido" aria-label="Silenciar la música"></button>
    </div>
    <div class="acciones" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-3.2-6.4L21 4l-1.2 4.2A8 8 0 0 1 20 12z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 3L3 10l7 3 3 7z"/><path d="M10 13l11-10"/></svg>
      <svg class="guardar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
    </div>
    <div class="pie">
      <p><b>hight</b> <span id="pie-texto"></span></p>
      <p class="tags" id="pie-tags"></p>
      <p class="etiquetas" id="pie-etiquetas"></p>
      <p class="fecha" id="pie-fecha"></p>
    </div>
    <button class="solo" id="solo" aria-pressed="false">Pasar solo al siguiente cuando termine la música</button>
  </div>
</section>

<audio id="audio" preload="none"></audio>

<script>
/*DATOS*/
const $ = (id) => document.getElementById(id);
const audio = $('audio');
const ICONO_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICONO_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
let actual = -1;
let silencio = false;
let solo = false;
try { silencio = localStorage.getItem('desfile-silencio') === '1'; } catch (e) {}

// la cuadrícula: el post más nuevo arriba a la izquierda
const orden = [...POSTS].reverse();
orden.forEach((p, i) => {
  const b = document.createElement('button');
  b.setAttribute('aria-label', `Abrir el post ${String(p.n).padStart(2, '0')}: ${p.alt}`);
  const img = document.createElement('img');
  img.src = p.src; img.alt = ''; img.decoding = 'async';
  if (i > 8) img.loading = 'lazy';
  b.append(img);
  b.addEventListener('click', () => abrir(i, true));
  $('cuadricula').append(b);
});

// La música suena con Web Audio: cada post repite su pedazo justo en el compás, sin cortes ni saltos.
// Si no se puede (por ejemplo, con el archivo abierto desde el disco), suena con el elemento <audio>.
const AC = window.AudioContext || window.webkitAudioContext;
const sin = (r) => { if (r && r.catch) r.catch(() => {}); };
const buffers = {};
let ctx = null;
let volumen = null;
let fuente = null;
let turno = 0;
let conElemento = !AC;

function contexto() {
  if (conElemento) return null;
  if (!ctx) {
    // en el iPhone, que suene aunque el teléfono esté en modo silencio, como sonaba con <audio>
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try { ctx = new AC(); } catch (e) { conElemento = true; return null; }
    volumen = ctx.createGain();
    volumen.gain.value = silencio ? 0 : 1;
    volumen.connect(ctx.destination);
  }
  if (ctx.state !== 'running') sin(ctx.resume());
  return ctx;
}

function cargar(pista) {
  if (!buffers[pista]) {
    buffers[pista] = fetch(PISTAS[pista])
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then((datos) => new Promise((ok, mal) => ctx.decodeAudioData(datos, ok, mal)));
  }
  return buffers[pista];
}

function pintarSonido() {
  $('sonido').innerHTML = silencio ? ICONO_OFF : ICONO_ON;
  $('sonido').setAttribute('aria-label', silencio ? 'Activar la música' : 'Silenciar la música');
  audio.muted = silencio;
  if (volumen) volumen.gain.setTargetAtTime(silencio ? 0 : 1, ctx.currentTime, 0.02);
}

function callar() {
  turno++;
  if (fuente) {
    const t = ctx.currentTime;
    fuente.g.gain.cancelScheduledValues(t);
    fuente.g.gain.setValueAtTime(fuente.g.gain.value, t);
    fuente.g.gain.linearRampToValueAtTime(0, t + 0.12);
    try { fuente.f.stop(t + 0.15); } catch (e) {}
    fuente = null;
  }
  audio.pause();
}

function sonarElemento(p) {
  const src = PISTAS[p.pista];
  const empezar = () => {
    try { audio.currentTime = p.desde; } catch (e) {}
    sin(audio.play());
  };
  if (!audio.src.endsWith(src)) {
    audio.src = src;
    audio.addEventListener('canplay', empezar, { once: true });
    audio.load();
  } else {
    empezar();
  }
}

function sonar(p) {
  callar();
  const mio = turno;
  const c = contexto();
  if (!c) { sonarElemento(p); return; }
  cargar(p.pista).then((buf) => {
    if (mio !== turno) return;
    const f = c.createBufferSource();
    const g = c.createGain();
    f.buffer = buf;
    f.loop = true;
    f.loopStart = p.desde;
    f.loopEnd = p.desde + p.dura;
    const t = c.currentTime + 0.02;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(1, t + 0.05);
    f.connect(g);
    g.connect(volumen);
    f.start(t, p.desde);
    fuente = { f, g, inicio: t, p };
  }).catch(() => {
    if (mio !== turno) return;
    conElemento = true;
    sonarElemento(p);
  });
}

function abrir(i, gesto) {
  actual = (i + orden.length) % orden.length;
  const p = orden[actual];
  $('foto-img').style.opacity = 0;
  $('foto-img').onload = () => { $('foto-img').style.opacity = 1; };
  $('foto-img').src = p.src;
  $('foto-img').alt = p.alt;
  $('post-numero').textContent = `Post ${String(p.n).padStart(2, '0')} de 20`;
  $('musica-nombre').textContent = `${p.pistaNombre} · Audio original de HIGHT`;
  $('pie-texto').innerHTML = p.lineas.map((l) => l.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))).join('<br>');
  $('pie-tags').textContent = p.hashtags;
  $('pie-etiquetas').textContent = `Productos etiquetados: ${p.etiquetas}`;
  $('pie-fecha').textContent = p.fecha;
  $('post').hidden = false;
  document.body.style.overflow = 'hidden';
  pintarSonido();
  sonar(p);
  if (gesto) $('cerrar').focus();
}

function cerrar() {
  $('post').hidden = true;
  document.body.style.overflow = '';
  callar();
  const b = $('cuadricula').children[actual];
  if (b) b.focus();
}

// con <audio>, el pedazo se repite (o pasa al siguiente post) al llegar al final
audio.addEventListener('timeupdate', () => {
  if (actual < 0 || !conElemento || $('post').hidden) return;
  const p = orden[actual];
  if (audio.currentTime >= p.desde + p.dura - 0.05) {
    if (solo) abrir(actual + 1);
    else audio.currentTime = p.desde;
  } else if (audio.currentTime < p.desde - 0.3) {
    try { audio.currentTime = p.desde; } catch (e) {}
  }
});

// con Web Audio, el pase al siguiente post cuando termina la música
setInterval(() => {
  if (!solo || !fuente || $('post').hidden) return;
  if (ctx.currentTime >= fuente.inicio + fuente.p.dura - 0.12) abrir(actual + 1);
}, 40);

// la música para cuando la página queda en segundo plano
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (ctx) sin(ctx.suspend());
    audio.pause();
  } else if (!$('post').hidden) {
    if (conElemento) sin(audio.play());
    else if (ctx) sin(ctx.resume());
  }
});

$('cerrar').addEventListener('click', cerrar);
$('anterior').addEventListener('click', () => abrir(actual - 1));
$('siguiente').addEventListener('click', () => abrir(actual + 1));
const alternar = () => {
  silencio = !silencio;
  try { localStorage.setItem('desfile-silencio', silencio ? '1' : '0'); } catch (e) {}
  pintarSonido();
  if (silencio || actual < 0 || $('post').hidden) return;
  if (conElemento) { if (audio.paused) sonarElemento(orden[actual]); }
  else if (!fuente) sonar(orden[actual]);
  else contexto();
};
$('sonido').addEventListener('click', alternar);
$('musica').addEventListener('click', alternar);
$('solo').addEventListener('click', () => {
  solo = !solo;
  $('solo').setAttribute('aria-pressed', String(solo));
});
document.addEventListener('keydown', (e) => {
  if ($('post').hidden) return;
  if (e.key === 'Escape') cerrar();
  if (e.key === 'ArrowLeft') abrir(actual - 1);
  if (e.key === 'ArrowRight') abrir(actual + 1);
});
let x0 = null;
$('foto').addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
$('foto').addEventListener('touchend', (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 45) abrir(actual + (dx < 0 ? 1 : -1));
  x0 = null;
});
</script>
