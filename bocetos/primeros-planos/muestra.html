<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muestra del perfil · primeros planos</title>
<style>
@font-face { font-family: G; src: url(../../assets/space-grotesk-latin.woff2); font-weight: 300 700; }
:root { --bg:#0b0b0c; --fg:#f2f2f2; --muted:#9a9a9f; --line:#262628; --surface:#1c1c1f; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.35 G, system-ui, sans-serif; width: 430px; }
.top { display:flex; justify-content:space-between; align-items:center; padding: 14px 16px 10px; }
.top b { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.top span { display:flex; gap:18px; }
.top svg { width: 24px; height: 24px; }
.cabeza { display:grid; grid-template-columns: auto 1fr; gap: 22px; align-items:center; padding: 4px 16px 10px; }
.avatar { width: 86px; height: 86px; border-radius: 50%; background:#0d0c0b; display:grid; place-items:center; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px #dff04a; }
.avatar img { width: 70%; }
.cuentas { display:flex; justify-content: space-around; text-align:center; }
.cuentas b { display:block; font-size: 17px; }
.cuentas span { font-size: 13px; }
.bio { padding: 0 16px 12px; display:grid; gap: 1px; }
.bio .cat { color: var(--muted); }
.bio a { color: #a8b8ff; text-decoration:none; }
.botones { display:grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 16px 14px; }
.botones span { background: var(--surface); border-radius: 8px; padding: 7px; text-align:center; font-weight: 600; }
.botones span:first-child { background:#dff04a; color:#0b0b0c; }
.destacadas { display:flex; gap: 14px; padding: 0 16px 14px; }
.destacadas div { width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line); padding: 3px; }
.destacadas i { display:block; width:100%; height:100%; border-radius:50%; background-size: cover; background-position:center; }
.pestanas { display:grid; grid-template-columns: repeat(3,1fr); border-bottom: 1px solid var(--line); }
.pestanas span { display:grid; place-items:center; padding: 10px 0; color: var(--muted); }
.pestanas span:first-child { color: var(--fg); box-shadow: inset 0 -1.5px 0 var(--fg); }
.pestanas svg { width: 22px; height: 22px; }
.grid { display:grid; grid-template-columns: repeat(3,1fr); gap: 2px; }
.grid img { width:100%; aspect-ratio: 3/4; object-fit: cover; display:block; }
</style>
